name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit tests, admin build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @zinu/shared test
      - run: pnpm --filter @zinu/admin build

  api:
    name: API end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: zinu
          POSTGRES_PASSWORD: zinu
          POSTGRES_DB: zinu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zinu" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # S3-compatible storage for upload tests (service containers cannot take a command, so start it here).
      - run: docker run -d --name s3 -p 9000:9000 -e RUSTFS_ACCESS_KEY=zinu-dev -e RUSTFS_SECRET_KEY=zinu-dev-secret rustfs/rustfs:latest /data
      - run: for i in $(seq 1 30); do curl -s -o /dev/null localhost:9000 && break; sleep 1; done
      - run: pnpm install --frozen-lockfile
      # Uses apps/api/.env.test (test-only secrets, database zinu_test).
      - run: pnpm --filter @zinu/api test

  api-image:
    name: API Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t zinu-api .

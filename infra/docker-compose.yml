# Local development services. Usage: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: zinu
      POSTGRES_PASSWORD: zinu
      POSTGRES_DB: zinu
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zinu"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  # S3-compatible object storage for driver documents (AWS S3 is used in production).
  storage:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: zinu-dev
      RUSTFS_SECRET_KEY: zinu-dev-secret
    ports: ["9000:9000"]
    volumes: [s3data:/data]
volumes:
  pgdata:
  s3data:
